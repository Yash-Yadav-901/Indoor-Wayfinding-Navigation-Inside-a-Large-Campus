services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: indoor_wayfinding_app
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
